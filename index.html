<!DOCTYPE html>
<html lang="pt-PT" data-country="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101418">
  <meta name="description" content="Painel de Verificação — gestão de clientes e portais de governo">
  <title>Painel de Verificação — Gestão</title>
  <link rel="icon" href="assets/logos/gov_pt.svg">
  <link rel="stylesheet" href="shared/style.css">
  <style>
    :root{ --brand:#101418; --brand-soft:#f2f3f5; --brand-2:#0a7d33; }
    .p-shell{max-width:1180px;margin:0 auto;padding:0 20px}
    .p-top{padding:26px 0 18px;border-bottom:1px solid var(--line)}
    .p-top .p-shell{display:flex;align-items:center;gap:14px}
    .p-top h1{font-size:22px;margin:0;font-weight:800;letter-spacing:-.01em}
    .p-top .logo-dot{width:38px;height:38px;border-radius:10px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
    .p-top .sub{color:var(--ink-3);font-size:13.5px}
    .p-top .grow{flex:1}
    .p-top a.ghost{border:1px solid var(--line);border-radius:8px;padding:9px 14px;font-size:14px;color:var(--ink-2);font-weight:600}
    .p-top a.ghost:hover{background:var(--muted);text-decoration:none}

    .tabs{display:flex;flex-wrap:wrap;gap:6px;padding:16px 0;border-bottom:1px solid var(--line);background:#fff}
    .tab{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600;color:var(--ink-2);cursor:pointer;white-space:nowrap}
    .tab:hover{background:var(--muted)}
    .tab.is-active{background:var(--brand);color:#fff;border-color:var(--brand)}
    .tab .flag{font-size:16px}

    .p-main{padding:28px 0 80px}
    .p-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
    .p-head img{height:40px;width:auto}
    .p-head h2{margin:0;font-size:21px;font-weight:800}
    .p-head .sub{color:var(--ink-3);font-size:14px}
    .p-head .grow{flex:1}
    .btn.sm{width:auto;padding:10px 15px;font-size:14px}
    .btn.danger{color:var(--err);border-color:var(--line);background:#fff}

    .p-cols{display:grid;grid-template-columns:360px 1fr;gap:22px;align-items:start}
    .panel{border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}
    .panel .ph{padding:15px 18px;border-bottom:1px solid var(--line-2);font-weight:700;font-size:15px;display:flex;align-items:center;gap:9px}
    .panel .pb{padding:18px}
    .panel .ph .grow{flex:1}

    table{width:100%;border-collapse:collapse;font-size:14.5px}
    th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
    th{font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3);font-weight:700}
    tr:last-child td{border-bottom:0}
    .rowname{font-weight:650}
    .rowmail{color:var(--ink-3);font-size:13px}
    .mini{background:none;border:1px solid var(--line);border-radius:7px;padding:6px 10px;font-size:13px;cursor:pointer;color:var(--ink-2);margin-right:6px}
    .mini:hover{background:var(--muted)}
    .mini.red{color:var(--err)}
    .linkbox{display:flex;gap:8px;align-items:center;background:var(--muted);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;color:var(--ink-2);overflow:hidden}
    .linkbox code{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
    .empty{color:var(--ink-3);font-size:14px;text-align:center;padding:26px 10px}
    .toast{left:auto;right:24px;transform:translateY(20px);bottom:24px}
    .toast.show{transform:translateY(0)}
    .email-preview{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
    .email-preview .ep-b{background:#f6f7f9;padding:18px}
    .email-preview .ep-card{background:#fff;border-radius:10px;overflow:hidden;max-width:560px;margin:0 auto;box-shadow:var(--shadow-sm)}
    .email-preview .ep-head{background:var(--brand);color:#fff;padding:20px;display:flex;align-items:center;gap:12px}
    .email-preview .ep-head img{height:34px;background:#fff;border-radius:6px;padding:4px}
    .email-preview .ep-body{padding:22px;font-size:14.5px;color:var(--ink-2);line-height:1.6}
    .email-preview .ep-btn{display:inline-block;background:var(--brand);color:#fff;padding:12px 22px;border-radius:8px;font-weight:700;text-decoration:none;margin:14px 0}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .kpi{display:flex;gap:14px;flex-wrap:wrap}
    .kpi .k{border:1px solid var(--line);border-radius:10px;padding:12px 16px;min-width:120px}
    .kpi .k b{display:block;font-size:22px}
    .kpi .k span{font-size:12.5px;color:var(--ink-3)}
    @media(max-width:900px){ .p-cols{grid-template-columns:1fr} .tabs{flex-wrap:nowrap;overflow-x:auto} }
    @media(max-width:560px){ .grid2{grid-template-columns:1fr} .tab{padding:8px 12px} }
  </style>
</head>
<body>
  <div class="p-top">
    <div class="p-shell">
      <div class="logo-dot">PV</div>
      <div>
        <h1>Painel de Verificação</h1>
        <div class="sub">Escolha o governo, cadastre o cliente e envie o link de verificação.</div>
      </div>
      <div class="grow"></div>
      <a class="ghost" href="admin.html">Clientes &amp; configurações</a>
    </div>
  </div>

  <div class="p-shell">
    <div class="tabs" id="tabs"></div>
  </div>

  <div class="p-main">
    <div class="p-shell" id="main"></div>
  </div>

  <script src="shared/config.js"></script>
  <script src="shared/app.js"></script>
  <script src="shared/mail.js"></script>
  <script src="shared/panel.js"></script>
</body>
</html>
